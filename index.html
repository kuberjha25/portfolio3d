<!doctype html>
<html lang="en">
  <head>
    <!-- UTF-8 Support -->
    <meta charset="UTF-8" />
    <!-- IE Compatibility -->
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme Color -->
    <meta name="theme-color" content="#050816" />
    <!-- Description -->
    <meta
      name="description"
      content="Modern 3D Portfolio using React, Three.js and Typescript"
    />
    <!-- Keywords -->
    <meta
      name="keywords"
      content="reactjs, react, porfolio-app, three-js, modern-ui/ux, js, javascript, html, css, tailwindcss"
    />
    <!-- Author -->
    <meta name="author" content="Kuber Jha" />
    <link rel="author" href="https://github.com/kuberjha25" />

    <!-- Lite mode for slow devices / connections (adds class="lite" to <html>).
         Force it on or off with ?lite=1 or ?lite=0 in the URL. -->
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("lite");
          var n = navigator, c = n.connection || {};
          var lite =
            q === "1" ||
            (q !== "0" &&
              (c.saveData === true ||
                /(^|-)2g$|^3g$/.test(c.effectiveType || "") ||
                (n.deviceMemory && n.deviceMemory <= 2) ||
                (n.deviceMemory && n.deviceMemory <= 4 && n.hardwareConcurrency <= 4) ||
                matchMedia("(prefers-reduced-motion: reduce)").matches));
          var mobile = matchMedia("(max-width: 767px)").matches;
          var html = document.documentElement;
          if (lite) html.classList.add("lite");
          // Start downloading the first hero frame right away.
          var l = document.createElement("link");
          l.rel = "preload";
          l.as = "image";
          l.href = "/hero/" + (mobile ? "m" : "d") + "/000.webp";
          document.head.appendChild(l);
        } catch (e) {}
      })();
    </script>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;900&display=swap"
    />
    <link rel="preload" href="/fonts/kuber.woff2" as="font" type="font/woff2" crossorigin />

    <!-- Icon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/favicon16.png" type="image/png" sizes="16x16" />
    <link rel="icon" href="/favicon32.png" type="image/png" sizes="32x32" />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
      type="image/png"
      sizes="180x180"
    />

    <!-- Color Schema -->
    <meta name="color-scheme" content="dark" />

    <!-- Title -->
    <title>Kuber Jha</title>
  </head>
  <body>
    <noscript></noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
